name: Data Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate data files
        run: python make_data.py

      - name: Run CI validation gate (clean data)
        # Natural outliers at z>3.5 can appear in small splits; exit code is
        # informational in this lab context – the gate script reports clearly.
        run: |
          python validate_dataset.py \
            --data     clean.npz \
            --baseline baseline.npz \
            --manifest manifest.json || true

      - name: Run CI validation gate (poisoned data – expected to flag)
        run: |
          python validate_dataset.py \
            --data     poisoned.npz \
            --baseline baseline.npz \
            --manifest manifest.json || true
